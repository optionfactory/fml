<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <script src="../../dist/ftl.iife.js"></script>
    <link href="../../dist/ful.css" rel="stylesheet">
    <script src="../../dist/httpc.iife.min.js"></script>
    <script src="../../dist/ful.iife.min.js"></script>
    <script>
        ftl.registry
            .plugin(new ful.Plugin())
            .configure();
    </script>
    <style>
        body {
            margin: 1rem;
        }
        ful-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 40rem;
            padding: 1rem;
            border: 1px solid canvasText;
        }
        ful-form form {
            display: contents;
        }
        .option {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 1rem;
        }
    </style>
</head>

<body>
    <ful-form>
                <h1>ful-select</h1>

                <ful-select name="test.multi.select" value="test-key-4">
                    <span slot="before">@</span>
                    A ful-select
                    <select slot="options">
                        <option value="test-key-1">test-label-1</option>

                <ful-select>
                    <span slot="before">@</span>
                    An empty select
                </ful-select>

                <ful-select name="test.multi.select" value="test-key-4">
                    <span slot="before">@</span>
                    A ful select with a templated menu
                    <select slot="options">
                        <option value="test-key-1">test-label-1</option>
                        <option value="test-key-2">test-label-2</option>
                        <option value="test-key-3">test-label-3</option>
                    </select>
                    <template slot="dropdown">
                        <li data-tpl-each="self" data-tpl-selected="index == 0" data-tpl-value="index" class="option">
                            <div>
                                <ful-icon name="star" aria-hidden="true"></ful-icon>
                            </div>
                            <div>
                                <div>My custom option</div>
                                <b>{{ label }}</b>
                            </div>
                        </li>
                    </template>
                </ful-select>

                <ful-select method="GET" src="https://jsonplaceholder.typicode.com/posts" revision="12" k-expr="id" l-expr="title">

                <div>
                    <label for="native-select">A plain native select, for comparison</label>

            </ful-form>

</html>
