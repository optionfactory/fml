<!DOCTYPE html>
<html lang="it">

<head>
    <title>ful table</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link href="../../dist/ful.css" rel="stylesheet">
    <link href="../base.css" rel="stylesheet">
    <script src="../../dist/fml.iife.min.js"></script>
    <script src="../theme.js" defer></script>
            <style>
        .filters {
            display: flex;
            gap: 0.5rem;
            align-items: start;
        }
        .filters > * {
            flex: 1;
        }
        .filters > button {
            flex: none;
        }
        .pill {
            display: inline-block;
            margin-right: 0.25rem;
            padding: 0.125rem 0.5rem;
            border: 1px solid currentColor;
            border-radius: 9999px;
            font-size: 0.75rem;
        }
    </style>
</head>

<body>
    <h1>ful-table</h1>
    <p>A filtered, sorted, paginated table over a mock loader: the filters feed the load, the sorter claims the header, the pagination walks the pages.</p>
    <fieldset>
        <legend>a hundred rows, walked and filtered</legend>
        <ful-table loader="loaders:mock-data" autoload page-size="25">
        <div slot="filters" class="filters">
            <ful-filter-text name="byName">
                Nome
            </ful-filter-text>
            <ful-filter-instant name="byAt">
                Data
            </ful-filter-instant>
            <ful-filter-number name="byCount">
                Id
            </ful-filter-number>
        </div>
        <template slot="schema">
            <schema>
                <column title="Id" sorter="id" order="desc">
                    {{ id }}
                </column>
                <column title="Tipo">
                    <span class="pill" data-tpl-each="types">{{ self }}</span>
                </column>
                <column title="Utente" sorter="username">{{ username }}</column>
                <column title="Data" sorter="date">{{ date }}</column>
            </schema>
        </template>
    </ful-table>
    </fieldset>
    <script src="../markup.js"></script>
    <script>
        class MockDataLoader {
            #mockdata = Array.from({ length: 100 }, (x, i) => ({ id: i + 1, types: ['type1', 'type2'], username: `test${i}@example.com`, date: '2025-01-01', active: i % 2 === 0 }));
            async load(pageRequest, sortRequest, filterRequest) {
                await ful.Timing.sleep(500);
                const compare = {
                    EQ: (a, b) => a === b,
                    NEQ: (a, b) => a !== b,
                    LT: (a, b) => a < b,
                    GT: (a, b) => a > b,
                    LTE: (a, b) => a <= b,
                    GTE: (a, b) => a >= b,
                    BETWEEN: (a, l, h) => l <= a && a <= h
                };
                const keep = (row) => {
                    const name = filterRequest?.byName;
                    if (name && !row.username.toLowerCase().includes(name[2].toLowerCase())) {
                        return false;
                    }
                    const count = filterRequest?.byCount;
                    if (count && !compare[count[0]](row.id, ...count.slice(1).map(Number))) {
                        return false;
                    }
                    const active = filterRequest?.byActive;
                    if (active && !compare[active[0]](row.active, active[1] === 'true')) {
                        return false;
                    }
                    const at = filterRequest?.byAt;
                    if (at && !compare[at[0]](`${row.date}T23:59:59.999Z`, ...at.slice(1))) {
                        return false;
                    }
                    return true;
                };
                const rows = [...this.#mockdata.filter(keep)];
                if (sortRequest) {
                    rows.sort((a, b) => (a[sortRequest.sorter] > b[sortRequest.sorter] ? 1 : -1) * (sortRequest.order === 'asc' ? 1 : -1));
                }
                return {
                    size: rows.length,
                    data: rows.slice(pageRequest.size * pageRequest.page, pageRequest.size * (pageRequest.page + 1))
                };
            }
            static create() {
                return new MockDataLoader();
            }
        }

        ftl.registry
            .plugin(new ful.Plugin())
            .defineComponent("loaders:mock-data", MockDataLoader)
            .configure();
    </script>
</body>

</html>
