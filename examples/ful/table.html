<html lang="it">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" integrity="sha256-oxqX0LQclbvrsJt8IymkxnISn4Np2Wy2rY9jjoQlDEg=" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" crossorigin="anonymous">
    <script src="../../dist/ftl.iife.js"></script>
    <link href="../../dist/ful.css" rel="stylesheet">
    <script src="../../dist/httpc.iife.min.js"></script>
    <script src="../../dist/ful.iife.min.js"></script>
    <script>
        class MockDataLoader {
            #mockdata = Array.from({ length: 100 }, (x, i) => ({ id: i + 1, types: ['type1', 'type2'], username: `test${i}@exaqmple.com`, date: '2025-01-01', active: i % 2 === 0 }));
            async load(pageRequest, sortRequest, filterRequest) {
                await ful.Timing.sleep(500);
                const compare = {
                    EQ: (a, b) => a === b,
                    NEQ: (a, b) => a !== b,
                    LT: (a, b) => a < b,
                    GT: (a, b) => a > b,
                    LTE: (a, b) => a <= b,
                    GTE: (a, b) => a >= b,
                    BETWEEN: (a, l, h) => l <= a && a <= h
                };
                const keep = (row) => {
                    const name = filterRequest?.byName;
                    if (name && !row.username.toLowerCase().includes(name[2].toLowerCase())) {
                        return false;
                    }
                    const count = filterRequest?.byCount;
                    if (count && !compare[count[0]](row.id, ...count.slice(1).map(Number))) {
                        return false;
                    }
                    const active = filterRequest?.byActive;
                    if (active && !compare[active[0]](row.active, active[1] === 'true')) {
                        return false;
                    }
                    return true;
                };
                const rows = this.#mockdata.filter(keep);
                return {
                    size: rows.length,
                    data: rows.slice(pageRequest.size * pageRequest.page, pageRequest.size * (pageRequest.page + 1))
                };
            }
            static create() {
                return new MockDataLoader();
            }
        }

        ftl.registry
            .plugin(new ful.Plugin())
            .defineComponent("loaders:mock-data", MockDataLoader)
            .configure();
    </script>
</head>

<body>
    <div class="container-fluid">
        <ful-table loader="loaders:mock-data" autoload page-size="25" class="d-flex flex-column h-100">
            <div slot="filters" class="d-flex gap-2">
                <ful-filter-text class="col" name="byName">
                    Nome
                </ful-filter-text>
                <ful-filter-instant class="col" name="byAt">
                    Data
                </ful-filter-instant>
                <ful-filter-number class="col" name="byCount">
                    Id
                </ful-filter-number>
                <ful-filter-boolean class="col" name="byActive">
                    Attivo
                </ful-filter-boolean>
                <button class="btn btn-primary" type="submit">Search</button>
            </div>
            <template slot="schema">
                <schema>
                    <column title="Id" sorter="byId" order="desc">
                        {{ id }}
                    </column>
                    <column title="Tipo">
                        <span class="badge badge-lg rounded-pill text-bg-secondary me-1" data-tpl-each="types">{{ self }}</span>
                    </column>
                    <column title="Utente">{{ username }}</column>
                    <column title="Data">{{ date }}</column>
                </schema>
            </template>
        </ful-table>
    </div>
</body>

</html>
