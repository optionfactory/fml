<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" integrity="sha256-oxqX0LQclbvrsJt8IymkxnISn4Np2Wy2rY9jjoQlDEg=" crossorigin="anonymous">

    <script src="../../dist/ftl.iife.js"></script>
    <link href="../../dist/ful.css" rel="stylesheet">
    <script src="../../dist/httpc.iife.min.js"></script>
    <script src="../../dist/ful.iife.min.js"></script>
    <style>
        fieldset {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            padding: 1rem;
        }
    </style>
</head>

<body>
    <fieldset>
        <ful-input-file multiple accept=".pdf,.png" maxfiles="2" maxfilesize="1048576">
            files
            <template slot="info">your documents</template>
        </ful-input-file>
        <checkout-summary></checkout-summary>
    </fieldset>

    <script>
        /**
         * An external component ships its own translations and the page wires
         * the active language's slice into the plugin, next to its own keys.
         */
        class CheckoutSummary extends ftl.ParsedElement {
            static template = `
                <label>total</label>
                <ful-control-group>
                    <ful-control>
                        <output>{{ #l10n:t('checkout.items', { 'count': 3 }) }}</output>
                    </ful-control>
                    <ful-affix>{{ #l10n:number(42.5, { 'style': 'currency', 'currency': 'EUR' }) }}</ful-affix>
                </ful-control-group>
            `;
            async render() {
                this.template().renderTo(this);
            }
        }

        const language = 'it';
        const CHECKOUT = {
            en: {
                'checkout.items': { one: '{count} item', other: '{count} items' },
            },
            it: {
                'checkout.items': { one: '{count} articolo', other: '{count} articoli' },
            },
        };

        ftl.registry
            .plugin(new ful.Plugin({
                language,
                translations: {
                    //reword a built-in…
                    'pagination.next': 'Avanti ancora',
                    //…or add your own: app strings and external components enter the same way
                    ...CHECKOUT[language],
                },
            }))
            .defineElement('checkout-summary', CheckoutSummary)
            .configure();
    </script>

    <script type="module">
        //remote overrides follow the same pattern: fetch the active language's JSON
        //before configure, and hand it over as the translations option
        //const translations = await (await fetch(`/l10n/${language}/overrides.json`)).json();
    </script>
</body>

</html>
