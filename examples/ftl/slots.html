<!DOCTYPE html>
<html lang="en">

<head>
    <title>ftl slots</title>
</head>
<script src="../../dist/ftl.iife.min.js"></script>
<link href="../base.css" rel="stylesheet">
    <script src="../theme.js" defer></script>
    <style>
    custom-element {
        display: block;
        padding: 1rem;
        margin: 1rem;
        border: var(--ful-border-width, 1px) solid var(--ful-border-color, light-dark(#dee2e6, #495057));
    }

</style>

<body>
    <custom-element>
        <template slot="schema">
            test
        </template>
    </custom-element>

    <script>

        class CustomElement extends ftl.ParsedElement {
            static slots= true;

            async render({slots}) {
                this.innerHTML = ftl.Fragments.toHtml(slots.schema);
            }
        }

        ftl.registry
            .defineElement("custom-element", CustomElement)
            .configure();
    </script>
    <script>
        document.addEventListener('ftl:ready', () => {
            console.log("ftl:ready!");
        });
    </script>
</body>

</html>
